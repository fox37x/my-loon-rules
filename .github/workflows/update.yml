name: Auto Update Loon Rules

on:
  schedule:
    # 每天北京时间 12:00
    - cron: "0 4 * * *"

  # 允许你在 Actions 页面手动更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Merge Blackmatrix7 Loon rules
        run: python scripts/merge_rules.py

      - name: Commit updated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/

          if git diff --cached --quiet; then
            echo "没有规则更新"
          else
            git commit -m "Auto update Loon rules"
            git push
          fi
